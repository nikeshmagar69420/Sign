<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SignSpeak — hand gestures, out loud</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="main-stage">
        <div class="cam-box" id="camBox">
          <video id="video" playsinline autoplay muted></video>
          <canvas id="overlay"></canvas>
          <div class="cam-placeholder" id="placeholder">
            <div class="big">🖐️</div>
            <div id="placeholderText">Starting camera…</div>
          </div>
        </div>

        <div class="status-bar">
          <span class="dot" id="statusDot"></span>
          <span id="statusText">Waiting for camera access.</span>
        </div>

        <div class="detected-panel">
          <div class="detected-word idle" id="detectedWord">
            Show a sign to begin
          </div>
        </div>
      </div>

      <aside class="side-panel">
        <div class="name-field">
          <label for="nameInput">Your name</label>
          <input id="nameInput" type="text" value="Nikesh" maxlength="24" />
        </div>

        <div class="cards" id="cardList"></div>
      </aside>
    </div>

    <audio id="triggerAudio" preload="auto" src="miku.mp3"></audio>

    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"
      crossorigin="anonymous"
    ></script>
    <script src="script.js"></script>
  </body>
</html>
